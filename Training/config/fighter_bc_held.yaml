# The learned pilots with the jet's sensors, second try (RH Aviator A24; TRAINING-CONCEPT, 2026-10-30; SIX: "All four fixes").
# The first try, fighter_bc.yaml (run sensors-bc), cloned the ace for its first million steps and then forgot it: with the
# cloning off, the entropy bonus pushed every update and nothing in the sparse reward pushed back, so by 20M steps the
# buttons were about coin flips and the stick's noise (sigma about 9) far past the trainer's clip at 3.
# Two changes from fighter_bc.yaml, everything else the same:
#   - the entropy bonus starts five times smaller and fades to nothing over the run (beta 1e-3, linear);
#   - the cloning never switches off: it pulls at a lower strength the whole run (steps 0 = constant), which also keeps
#     the stick's noise down (ML-Agents' cloning loss is the squared error of the sampled stick against the ace's).
# Every number here is AUTHORED, a starting point, not a tuned result. Judge the run by the players' [WHO-SHOT-WHOM]
# lines (who shot whom, the learned jets' kills, friends shot down, deaths and credits), not by its Elo: a jet's episode
# ends only when it goes down, always on a loss, so ML-Agents' rating can only fall.
#
# Train headless (from the project root), the demonstrations in Training/demos as for fighter_bc.yaml:
#   tools/headless-training/train_headless.ps1 -Action start -Run sensors-bc-held -Config Training/config/fighter_bc_held.yaml
# Watch the entropy against its ceiling (about 7.5 at the start: 1.42 for the stick plus 6.11 for the six button branches):
#   C:/Users/SIX/venvs/mlagents-1.1.0/Scripts/tensorboard --logdir Training/results

behaviors:
  Fighter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048          # decisions per gradient step; 8 jets × 10 decisions a second fill it in ~26 s of flight
      buffer_size: 20480        # ten batches between updates
      learning_rate: 3.0e-4
      learning_rate_schedule: constant   # self-play: the opponent keeps changing, so the learning rate does not decay
      beta: 1.0e-3              # entropy bonus: a fifth of sensors-bc's 5e-3 …
      beta_schedule: linear     # … and fading to nothing by max_steps
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true           # the senses are scaled to about ±1 already; this takes out what is left
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995            # a horizon of ~200 decisions (20 s): long enough to connect a turn to a kill
        strength: 1.0
    behavioral_cloning:         # J14: copy the ace, and keep copying
      demo_path: Training/demos # one .demo per jet, the ace riding along (FighterTraining, -recordDemos)
      strength: 0.25            # half of sensors-bc's 0.5, which held the brain sharp while it lasted
      steps: 0                  # never fades: the pull is the same at 20M steps as at the first
      samples_per_update: 0     # all of the demonstrations each update
    keep_checkpoints: 40        # every checkpoint of the run (sensors-bc kept 10 and lost its last sharp one)
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 256           # 25.6 s of decisions per trajectory piece
    summary_freq: 20000
    self_play:
      save_steps: 50000         # a snapshot of the brain for the opponents' pool every 50,000 steps
      team_change: 200000       # the learning side swaps every 200,000 steps
      swap_steps: 10000         # the opponent's snapshot changes this often
      window: 10                # the opponent is drawn from the last 10 snapshots …
      play_against_latest_model_ratio: 0.5   # … or, half the time, the latest
      initial_elo: 1200.0

engine_settings:
  time_scale: 20                # the Editor's or the build's clock at 20× (the tick is still 50 Hz of game time)
  target_frame_rate: -1
  capture_frame_rate: 0
  no_graphics: false            # pass --no-graphics for a headless build

checkpoint_settings:
  results_dir: Training/results
