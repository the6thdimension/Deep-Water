# The learned pilots against the rule pilots (TRAINING-CONCEPT M4's curriculum, kept one setting away by A15).
# Set red's brain to Rookie, then Line, then Ace (Deep Water → RH Aviator → Fighter Brains, or the Red Spawn's
# Training Squadron); blue stays Learning. No self-play: only one side's jets learn. Auto-train on Play (A18)
# runs this config whenever only one side has learning jets, as the rolling run "auto-vs-rest".
# To carry a self-play brain over:  --initialize-from=<that run id>.
#
# Start (from the project root):
#   C:/Users/SIX/venvs/mlagents-1.1.0/Scripts/mlagents-learn Training/config/fighter_vs_rules.yaml --run-id=fighter-vs-rookie-001 --results-dir=Training/results

behaviors:
  Fighter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 10000000
    time_horizon: 256
    summary_freq: 20000

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 0
  no_graphics: false

checkpoint_settings:
  results_dir: Training/results
