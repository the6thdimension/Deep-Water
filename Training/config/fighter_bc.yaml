# The learned pilots with the jet's sensors (SENSORS-CONCEPT J13, J14; RH Aviator A22; SIX 2026-10-29/30).
# Senses version 3 (140 numbers) and six action branches, so no older brain carries on: a fresh brain starts by
# copying the ace (behavioral cloning from the demonstrations in Training/demos), and the copying fades out over its
# first million steps while self-play PPO takes over, exactly as fighter_selfplay.yaml.
# Every number here is AUTHORED, a starting point, not a tuned result.
#
# Record the demonstrations first (the headless player, the ace riding along in every learned jet):
#   Builds/Background/Release/Dogfight_Training/Dogfight_Training.exe -batchmode -nographics -recordDemos 6000 -demoDir Training/demos
# Then train headless (from the project root):
#   tools/headless-training/train_headless.ps1 -Action start -Run sensors-bc -Config Training/config/fighter_bc.yaml
# Watch:  C:/Users/SIX/venvs/mlagents-1.1.0/Scripts/tensorboard --logdir Training/results

behaviors:
  Fighter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048          # decisions per gradient step; 8 jets × 10 decisions a second fill it in ~26 s of flight
      buffer_size: 20480        # ten batches between updates
      learning_rate: 3.0e-4
      learning_rate_schedule: constant   # self-play: the opponent keeps changing, so the learning rate does not decay
      beta: 5.0e-3              # entropy: keeps it trying new things while kills are still rare
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true           # the senses are scaled to about ±1 already; this takes out what is left
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995            # a horizon of ~200 decisions (20 s): long enough to connect a turn to a kill
        strength: 1.0
    behavioral_cloning:         # J14: copy the ace first, fading into self-play
      demo_path: Training/demos # one .demo per jet, the ace riding along (FighterTraining, -recordDemos)
      strength: 0.5             # how hard the copying pulls against PPO's own update at the start
      steps: 1000000            # the pull falls to nothing over the first million steps
      samples_per_update: 0     # all of the demonstrations each update
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 256           # 25.6 s of decisions per trajectory piece
    summary_freq: 20000
    self_play:
      save_steps: 50000         # a snapshot of the brain for the opponents' pool every 50,000 steps
      team_change: 200000       # the learning side swaps every 200,000 steps
      swap_steps: 10000         # the opponent's snapshot changes this often
      window: 10                # the opponent is drawn from the last 10 snapshots …
      play_against_latest_model_ratio: 0.5   # … or, half the time, the latest
      initial_elo: 1200.0

engine_settings:
  time_scale: 20                # the Editor's or the build's clock at 20× (the tick is still 50 Hz of game time)
  target_frame_rate: -1
  capture_frame_rate: 0
  no_graphics: false            # pass --no-graphics for a headless build

checkpoint_settings:
  results_dir: Training/results
