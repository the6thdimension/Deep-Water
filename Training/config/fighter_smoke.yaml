# A smoke of the self-play round: the same brain and trainer as fighter_selfplay.yaml, cut to 30,000 steps with
# small buffers, so the whole loop (connect, decide, pay, swap sides, export a model) runs in a few minutes.
# Proves the plumbing, not a pilot. First run 2026-10-29 (run id fighter-smoke-20261029).
#
#   C:/Users/SIX/venvs/mlagents-1.1.0/Scripts/mlagents-learn Training/config/fighter_smoke.yaml --run-id=fighter-smoke --results-dir=Training/results --force
#   then press Play in Dogfight Training.

behaviors:
  Fighter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 2
    checkpoint_interval: 15000
    max_steps: 30000
    time_horizon: 128
    summary_freq: 5000
    self_play:
      save_steps: 5000
      team_change: 10000
      swap_steps: 2000
      window: 5
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 0
  no_graphics: false
